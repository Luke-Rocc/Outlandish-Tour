workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: outlandish
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: dk.outlandishlive.app
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install packages
        script: npm install
      - name: Create iOS project
        script: ./scripts/ios-setup.sh
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
